name: Deploy app ke resepfoto.oziera.co.id
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload via FTP (hanya file yang berubah)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./app/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            data/*.sqlite*
            uploads/**
